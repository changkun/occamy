# An example occamyd configuration file, version 1. docs/configuration.md
# describes every key. The file holds no secrets: credentials name the
# file or environment variable that holds them, so it can be committed.
version: 1

# The public listener: the API, the streams and /healthz. Default :5636.
listen: 0.0.0.0:5636

# occamyd terminates TLS when both are set. Leave both out to serve plain
# HTTP behind a reverse proxy that terminates TLS.
tls:
  cert: /etc/occamy/tls.crt
  key: /etc/occamy/tls.key

# The debug listener, with expvar and pprof. Off when unset. Keep it on
# the loopback interface.
debug:
  address: localhost:6060

# Origins whose browsers may open streams, besides occamyd's own.
origins:
  - https://occamy.example.com

# Serves the v0 routes (/api/v0/login and /api/v0/connect) for the
# Guacamole-based web client. They are removed at v1.0.
legacy_v0: false

auth:
  # The Ed25519 key that signs occamyd's tokens, PKCS #8 PEM. occamyd
  # creates it on first start if it does not exist.
  signing_key_file: /var/lib/occamy/signing.key
  # How long an access token lasts, between 1m and 12h. Default 15m.
  access_token_lifetime: 15m
  # Third parties, such as a gateway, whose tokens occamyd accepts. Each
  # key is an Ed25519 public key, PKIX PEM. An issuer's users are its
  # own, and its tokens for a subject that names a static user are
  # refused, unless link_static_users lets them act as that user. Its
  # tokens' groups count only if allowed_groups lists them.
  trusted_issuers:
    - issuer: gateway
      public_key_file: /etc/occamy/gateway.pub
      link_static_users: true
      allowed_groups: [ops]
  # Static users sign in with a password, stored as a bcrypt hash of cost
  # 10 or more. htpasswd -nbBC 12 "" 'the password' | cut -d: -f2 makes
  # one.
  users:
    - name: alice
      password_hash: "$2a$12$R6bvkO3lC3JV/OaHnySvquk.wobMPB3XleIdoBgEwlhjbcfaZi0km"
      groups: [ops]
    - name: bob
      password_hash: "$2a$10$Ad6WcgC.YRhS7d8JbV/9..v/X5C7aAnBg5cVXdoz1F1d0uHmkmuH2"
      groups: [dev]
  # Sign-in through an OpenID Connect identity provider.
  oidc:
    issuer: https://accounts.example.com
    client_id: occamy
    client_secret_file: /run/secrets/oidc-client-secret
    redirect_url: https://occamy.example.com/api/v1/auth/oidc/callback
    # Where browsers go back to after signing in, with a one-time code in
    # the fragment; a sign-in names one exactly. Default: the origin of
    # redirect_url, with the path /.
    return_urls:
      - https://occamy.example.com/
    scopes: [openid, profile, email, groups]
    # The claims that name the user and the user's groups in allow lists.
    # Pick claims that users cannot set themselves.
    subject_claim: email
    groups_claim: groups
    # Admit only users that an allow list names, by name or by group.
    require_known_users: false
    # Let an OIDC user whose subject names a static user sign in as that
    # user. Off, such a sign-in is refused.
    link_static_users: false

# guacd serves the telnet connections, the vnc connections that do not
# set backend: native, and the rdp connections that set backend: guacd.
guacd:
  address: localhost:4822
  # guacd parameters per protocol. Connection targets and credentials
  # override them. rdp's apply only to connections on guacd.
  params:
    rdp:
      ignore-cert: "true"

# The connections that users may open. Tokens name a connection by its ID,
# which appears in URLs.
connections:
  - id: build-box
    name: Build box
    protocol: ssh
    target: build.internal:22
    # The host keys the server may present: SHA-256 fingerprints as
    # ssh-keygen -lf prints them, or public keys as ssh-keyscan prints
    # them. ssh connections need them, or insecure_ignore_host_key.
    host_keys:
      - SHA256:UtDMff7ThPohflGs6UL1iuiyvVrazbxQT9x0OtzIV7U
    credentials:
      username: deploy
      private_key_file: /etc/occamy/keys/deploy
    allow:
      users: [alice]
      groups: [ops]

  - id: nas-desktop
    name: NAS desktop
    protocol: vnc
    target: nas.internal # the protocol's default port, 5900
    # occamyd's own VNC client rather than guacd, the default for vnc
    # until the native backend passes its parity gate. tls and ard need
    # it.
    backend: native
    # The NAS's self-signed certificate, by the fingerprint that
    # openssl x509 -noout -fingerprint -sha256 prints.
    tls:
      pins: ["B7:2C:51:9E:0D:44:A3:6F:18:E2:95:7B:C0:3A:61:DD:4F:89:12:B6:E7:05:9C:73:2A:F1:58:0E:C4:93:6B:1D"]
    credentials:
      password_env: OCCAMY_NAS_VNC_PASSWORD
    allow:
      groups: [ops, dev]

  - id: studio-mac
    name: Studio Mac
    protocol: vnc
    target: studio-mac.internal
    backend: native
    # Apple Remote Desktop authentication, which macOS Screen Sharing
    # needs to log in a user of the Mac. Its key exchange authenticates no
    # server: anyone between occamyd and the Mac reads the account's
    # password. Only on a network you trust; not with a tls requirement.
    ard: true
    credentials:
      # The Mac's account; its password is asked of the session's owner.
      username: studio
      prompt: true
    allow:
      users: [alice]

  - id: windows
    name: Windows workstation
    protocol: rdp
    target: 10.0.4.20:3389
    # occamyd's own RDP client serves rdp connections unless backend:
    # guacd keeps one on guacd. It has not been checked against Windows
    # yet, only xrdp. security is nla by default; xrdp, which speaks no
    # NLA, needs security: tls or any.
    # Windows signs its RDP certificate itself unless given one: pin it,
    # by the fingerprint that openssl x509 -noout -fingerprint -sha256
    # prints.
    tls:
      pins: ["3F:A1:07:5C:92:E4:6B:D8:21:0A:F3:8E:57:C6:19:B4:E2:7D:40:95:A8:1C:6F:D3:0B:72:E9:58:34:AC:66:1F"]
    credentials:
      username: Administrator
      password_file: /run/secrets/windows-password
    allow:
      groups: [ops]

  - id: lab-shell
    name: Lab shell
    protocol: ssh
    target: "[fd00::22]"
    # Accepts any host key, with a warning in the log: for demos only.
    insecure_ignore_host_key: true
    credentials:
      # Nothing stored: the session owner is asked for what the server
      # needs, and the answers are not kept.
      prompt: true
    allow:
      groups: [dev]

# Ad-hoc targets let users connect to hosts that are not in the registry.
# Off by default; when on, only targets in the allowlist are reachable,
# on the protocol's own ports (ssh 22, vnc 5900-5999, rdp 3389, telnet
# 23) or those an entry names after a colon. Loopback, link-local,
# unspecified and multicast addresses need an entry of their own.
allow_adhoc_targets: false
adhoc_allowlist:
  - 10.0.0.0/8
  - "*.lab.internal:22"
# The backend of ad-hoc targets by protocol, as a connection's backend:
# ssh and rdp are native, and vnc and telnet go through guacd unless
# set. An ad-hoc rdp target on the native backend takes NLA, and a
# certificate that chains to the system's roots.
adhoc_backends:
  vnc: native

# What one user or one session may hold. Zero or absent is the default.
limits:
  # Sessions occamyd runs at once, whoever owns them. Default 1000.
  sessions: 500
  # Sessions one user owns at once. Default 10.
  sessions_per_user: 20
  # Viewers a session takes besides its owner. Default 50.
  viewers_per_session: 50
  # Unexpired shares a session has. Default 100.
  shares_per_session: 100

# What occamyd keeps for one viewer.
streams:
  # How long a viewer may leave frames unacknowledged, or one write to
  # it block, before it is dropped with close too-slow.
  # Default 30s.
  viewer_timeout: 45s
