name: Windows RDP

# Runs the native RDP client against the Remote Desktop server of the
# runner itself: a look at a real Windows server, by hand, and no gate.
# It may not pass, and nothing waits for it.
#
# The image starts with Remote Desktop's listener on port 3389, before
# any step of this job: the listener is the image's, not this workflow's.
# What this job guards is logging on to it. It disables every inbound
# allow rule that takes in the port, blocks the port from every other
# address on both address families, and confirms from what is in force
# that the firewall blocks by default and that no broad rule allows the
# port. Only then does it make the session's user, so that if that
# fails no user or password ever exists. There is no tunnel. The
# password is made at run time, the log masks it, and it ends with the
# runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      OCCAMY_RDP_WINDOWS_ADDR: 127.0.0.2:3389
      OCCAMY_RDP_WINDOWS_USER: occamyrdp
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    # A client that shares no code with ours, in its pinned versions and
    # from wheels alone. It comes before the password exists, and if it
    # cannot be had, the Go client still runs.
    - uses: actions/setup-python@v7
      id: python
      continue-on-error: true
      with:
        python-version: '3.12'
    - name: Install the independent client
      id: impacket
      if: steps.python.outcome == 'success'
      continue-on-error: true
      run: |
        python -m venv "$env:RUNNER_TEMP\rdp-check"
        & "$env:RUNNER_TEMP\rdp-check\Scripts\python.exe" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary ':all:' -r .github/windows-rdp-requirements.txt
    - name: The machine
      run: |
        $ErrorActionPreference = 'Continue'
        Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
        Get-Service TermService, SessionEnv, UmRdpService | Format-Table Name, Status, StartType
        Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultInboundAction
        Get-NetConnectionProfile | Format-Table InterfaceAlias, NetworkCategory, IPv4Connectivity, IPv6Connectivity
        reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /s
        query session
        exit 0
    - name: Keep port 3389 on this machine
      run: |
        # First what the image came with, before anything here changes
        # it. A fault in this part stops nothing.
        $ErrorActionPreference = 'Continue'
        $server = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
        Write-Output "fDenyTSConnections: $((Get-ItemProperty $server).fDenyTSConnections)"
        $tcp = Get-ItemProperty "$server\WinStations\RDP-Tcp"
        Write-Output "RDP-Tcp: UserAuthentication $($tcp.UserAuthentication), SecurityLayer $($tcp.SecurityLayer), PortNumber $($tcp.PortNumber)"
        $owners = @(Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue) + @(Get-NetUDPEndpoint -LocalPort 3389 -ErrorAction SilentlyContinue)
        Write-Output "$($owners.Count) endpoints on port 3389:"
        foreach ($owner in $owners) {
          $process = Get-Process -Id $owner.OwningProcess -ErrorAction SilentlyContinue
          $hosted = @(Get-CimInstance Win32_Service -Filter "ProcessId = $($owner.OwningProcess)" | ForEach-Object { $_.Name }) -join ', '
          Write-Output "  $($owner.CimClass.CimClassName) $($owner.LocalAddress): process $($owner.OwningProcess) ($($process.ProcessName)), services: $hosted"
        }
        Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue | Format-Table DisplayName, Enabled, Profile -AutoSize | Out-String -Width 160 | Write-Output

        function Test-Covers3389($filter) {
          if ("$($filter.Protocol)" -notin 'Any', 'TCP', 'UDP', '6', '17') { return $false }
          foreach ($port in @($filter.LocalPort)) {
            if ("$port" -eq 'Any') { return $true }
            if ("$port" -match '^\d+$' -and [int]"$port" -eq 3389) { return $true }
            if ("$port" -match '^(\d+)-(\d+)$' -and [int]$Matches[1] -le 3389 -and [int]$Matches[2] -ge 3389) { return $true }
          }
          return $false
        }
        $ports = @{}
        Get-NetFirewallPortFilter -All -PolicyStore ActiveStore | ForEach-Object { $ports[$_.InstanceID] = $_ }
        $applications = @{}
        Get-NetFirewallApplicationFilter -All -PolicyStore ActiveStore | ForEach-Object { $applications[$_.InstanceID] = $_ }
        $covering = @(Get-NetFirewallRule -PolicyStore ActiveStore | Where-Object {
          $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow' -and $_.Enabled -eq 'True' -and $null -ne $ports[$_.InstanceID] -and (Test-Covers3389 $ports[$_.InstanceID])
        })
        Write-Output "$($covering.Count) inbound allow rules take in port 3389:"
        foreach ($rule in $covering) {
          Write-Output "== $($rule.DisplayName) [$($rule.Profile)] id $($rule.InstanceID), source $($rule.PolicyStoreSource) ($($rule.PolicyStoreSourceType)), owner '$($rule.Owner)'"
          $applications[$rule.InstanceID] | Format-List * | Out-String -Width 200 | Write-Output
        }

        # Then tighten. The runner needs no inbound traffic, so every
        # rule that takes in the port goes, whatever it is held to. What
        # the active store shows cannot be changed there, so each is
        # disabled where it comes from. One that resists is not an error
        # here: the next step reads what is in force.
        $ErrorActionPreference = 'Stop'
        Set-NetFirewallProfile -All -Enabled True -DefaultInboundAction Block
        Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue | Disable-NetFirewallRule
        $others = '0.0.0.0-126.255.255.255', '128.0.0.0-255.255.255.255', '::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff'
        foreach ($protocol in 'TCP', 'UDP') {
          New-NetFirewallRule -DisplayName "occamy: RDP on this machine alone ($protocol)" -Direction Inbound -Action Block `
            -Protocol $protocol -LocalPort 3389 -RemoteAddress $others | Out-Null
        }
        $disabled = 0
        foreach ($rule in $covering) {
          $stores = @("$($rule.PolicyStoreSource)", 'PersistentStore', 'ConfigurableServiceStore') | Where-Object { $_ } | Select-Object -Unique
          $done = $false
          foreach ($store in $stores) {
            try {
              Disable-NetFirewallRule -Name $rule.InstanceID -PolicyStore $store -ErrorAction Stop
              Write-Output "disabled in ${store}: $($rule.DisplayName)"
              $done = $true
              break
            } catch {
              Write-Output "not in ${store}: $($rule.DisplayName): $($_.Exception.Message)"
            }
          }
          if ($done) { $disabled++ }
        }
        Write-Output "disabled $disabled of $($covering.Count) rules"
    - name: Confirm that nothing else admits port 3389
      run: |
        # What is in force, from the active store. Anything this cannot
        # read stops the job, and with it Remote Desktop.
        Write-Output "active profile: $((Get-NetFirewallSetting -PolicyStore ActiveStore).ActiveProfile)"
        $profiles = @(Get-NetFirewallProfile -All -PolicyStore ActiveStore)
        if ($profiles.Count -ne 3) { throw "read $($profiles.Count) firewall profiles" }
        foreach ($p in $profiles) {
          Write-Output "profile $($p.Name): enabled $($p.Enabled), default inbound $($p.DefaultInboundAction)"
          if ("$($p.Enabled)" -ne 'True' -or "$($p.DefaultInboundAction)" -ne 'Block') {
            throw "profile $($p.Name) does not block inbound traffic by default"
          }
        }

        $ports = @{}
        Get-NetFirewallPortFilter -All -PolicyStore ActiveStore | ForEach-Object { $ports[$_.InstanceID] = $_ }
        $addresses = @{}
        Get-NetFirewallAddressFilter -All -PolicyStore ActiveStore | ForEach-Object { $addresses[$_.InstanceID] = $_ }
        $applications = @{}
        Get-NetFirewallApplicationFilter -All -PolicyStore ActiveStore | ForEach-Object { $applications[$_.InstanceID] = $_ }
        $services = @{}
        Get-NetFirewallServiceFilter -All -PolicyStore ActiveStore | ForEach-Object { $services[$_.InstanceID] = $_ }
        $rules = @(Get-NetFirewallRule -PolicyStore ActiveStore)
        if ($rules.Count -eq 0) { throw 'read no firewall rules' }

        # Our block rules, on both address families.
        $blocks = @($rules | Where-Object { $_.DisplayName -like 'occamy: RDP on this machine alone*' -and $_.Direction -eq 'Inbound' -and $_.Action -eq 'Block' -and $_.Enabled -eq 'True' })
        if ($blocks.Count -ne 2) { throw "$($blocks.Count) of our 2 block rules are in force" }
        foreach ($rule in $blocks) {
          $remote = @($addresses[$rule.InstanceID].RemoteAddress)
          Write-Output "$($rule.DisplayName): remote $($remote -join ', ')"
          if (-not ($remote -match '\.') -or -not ($remote -match ':')) { throw "$($rule.DisplayName) does not cover both address families" }
        }

        function Test-Covers3389($filter) {
          if ("$($filter.Protocol)" -notin 'Any', 'TCP', 'UDP', '6', '17') { return $false }
          foreach ($port in @($filter.LocalPort)) {
            if ("$port" -eq 'Any') { return $true }
            if ("$port" -match '^\d+$' -and [int]"$port" -eq 3389) { return $true }
            if ("$port" -match '^(\d+)-(\d+)$' -and [int]$Matches[1] -le 3389 -and [int]$Matches[2] -ge 3389) { return $true }
          }
          return $false
        }

        # Every inbound allow rule whose ports take in 3389, whatever its
        # addresses and profiles. A rule held to a program, a package or
        # a service other than what serves RDP cannot admit RDP, so it is
        # listed rather than counted; anything else stops the job.
        $allows = @($rules | Where-Object { $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow' -and $_.Enabled -eq 'True' })
        Write-Output "$($rules.Count) rules in force, $($allows.Count) of them allow inbound traffic"
        $unread = 0
        $broad = @()
        $scoped = @()
        foreach ($rule in $allows) {
          $port = $ports[$rule.InstanceID]
          $application = $applications[$rule.InstanceID]
          $service = $services[$rule.InstanceID]
          if ($null -eq $port -or $null -eq $application -or $null -eq $service) { $unread++; continue }
          if (-not (Test-Covers3389 $port)) { continue }
          $program = "$($application.Program)"
          $package = "$($application.Package)"
          $name = "$($service.Service)"
          $line = "$($rule.DisplayName) [$($rule.Profile)] program '$program' package '$package' service '$name' protocol $($port.Protocol) ports $(@($port.LocalPort) -join ',') remote $(@($addresses[$rule.InstanceID].RemoteAddress) -join ',')"
          $rdpProgram = $program -eq 'Any' -or $program -eq 'System' -or $program -match 'svchost\.exe$'
          $rdpService = $name -eq 'Any' -or $name -eq 'TermService'
          $noPackage = $package -eq '' -or $package -eq 'Any'
          if ($rdpProgram -and $rdpService -and $noPackage) { $broad += $line } else { $scoped += $line }
        }
        Write-Output "held to other programs, not counted ($($scoped.Count)):"
        $scoped | ForEach-Object { Write-Output "  $_" }
        Write-Output "broad enough to admit RDP ($($broad.Count)):"
        $broad | ForEach-Object { Write-Output "  $_" }
        if ($unread -gt 0) { throw "could not read the filters of $unread allow rules" }
        if ($broad.Count -gt 0) { throw "$($broad.Count) allow rules could admit port 3389" }
    - name: Make the session's user
      run: |
        $bytes = New-Object byte[] 24
        [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
        $password = 'Aa1-' + ([System.BitConverter]::ToString($bytes) -replace '-', '').ToLower()
        Write-Output "::add-mask::$password"
        New-LocalUser -Name $env:OCCAMY_RDP_WINDOWS_USER -Password (ConvertTo-SecureString $password -AsPlainText -Force) `
          -PasswordNeverExpires -AccountNeverExpires | Out-Null
        Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:OCCAMY_RDP_WINDOWS_USER
        "OCCAMY_RDP_WINDOWS_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Make sure Remote Desktop is on, with NLA
      id: listener
      run: |
        $server = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
        Set-ItemProperty $server -Name fDenyTSConnections -Value 0
        Set-ItemProperty "$server\WinStations\RDP-Tcp" -Name UserAuthentication -Value 1
        Set-Service TermService -StartupType Manual
        Start-Service TermService
        function Wait-Listener($seconds) {
          $deadline = (Get-Date).AddSeconds($seconds)
          while ((Get-Date) -lt $deadline) {
            if (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue) { return $true }
            Start-Sleep -Seconds 2
          }
          return $false
        }
        if (-not (Wait-Listener 30)) {
          Write-Output 'nothing listens after 30 s: restarting TermService'
          Restart-Service TermService -Force
          if (-not (Wait-Listener 90)) { throw 'nothing listens on port 3389' }
        }
        Get-NetTCPConnection -LocalPort 3389 -State Listen | Format-Table LocalAddress, LocalPort, State
    - name: Have Windows log what it refuses
      run: |
        $ErrorActionPreference = 'Continue'
        # Whether Schannel takes this without a reboot, which would end the
        # job, the System log shows at the end.
        $schannel = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL'
        Set-ItemProperty $schannel -Name EventLogging -Value 7 -Type DWord
        Get-ItemProperty $schannel | Format-List EventLogging
        auditpol /set /subcategory:Logon /success:enable /failure:enable
        Get-WinEvent -ListLog Security | Format-List IsEnabled, LogMode, MaximumSizeInBytes, RecordCount, LastWriteTime
        exit 0
    - name: Run the client against this machine
      env:
        OCCAMY_RDP_DUMP: ${{ runner.temp }}\rdp-dump
        OCCAMY_RDP_WINDOWS_TRACE: "1"
      run: |
        # Go's progress goes to stderr, and the exit code says how it ended.
        $ErrorActionPreference = 'Continue'
        New-Item -ItemType Directory -Force -Path $env:OCCAMY_RDP_DUMP | Out-Null
        go test -tags rdp_windows -run '^TestWindows$' -v -count=1 -timeout 20m ./internal/rdp/ | Tee-Object -FilePath "$env:RUNNER_TEMP\rdp-test.log"
    - name: Run an independent client against this machine
      if: always() && steps.listener.outcome == 'success' && steps.impacket.outcome == 'success'
      env:
        OCCAMY_RDP_CHECK_LOG: ${{ runner.temp }}\rdp-check.log
      run: |
        # What it reports is for reading against the server's logon events
        # below, at the times it logs. The password reaches it from the
        # environment, not from a command line.
        $ErrorActionPreference = 'Continue'
        & "$env:RUNNER_TEMP\rdp-check\Scripts\python.exe" .github/windows-rdp-check.py
        Write-Output "the driver exited with $LASTEXITCODE"
        Get-Content -LiteralPath $env:OCCAMY_RDP_CHECK_LOG
        exit 0
    - name: What the server recorded
      if: always()
      run: |
        $ErrorActionPreference = 'Continue'
        query session
        Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue | Format-Table LocalAddress, RemoteAddress, State
        foreach ($log in 'Microsoft-Windows-TerminalServices-LocalSessionManager/Operational',
                         'Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational',
                         'Microsoft-Windows-RemoteDesktopServices-RdpCoreTS/Operational') {
          Write-Output "== $log"
          Get-WinEvent -LogName $log -MaxEvents 120 -ErrorAction SilentlyContinue | Sort-Object TimeCreated |
            Format-Table -AutoSize -Wrap TimeCreated, Id, Message
        }
        Write-Output '== Schannel, in the System log'
        $schannel = @(Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Schannel' } -MaxEvents 80 -ErrorAction SilentlyContinue | Sort-Object TimeCreated)
        Write-Output "$($schannel.Count) events"
        $schannel | Format-Table -AutoSize -Wrap TimeCreated, Id, Message
        Write-Output '== the session user, apart from Remote Desktop'
        if ($env:OCCAMY_RDP_WINDOWS_PASSWORD) {
          Add-Type -AssemblyName System.DirectoryServices.AccountManagement
          $machine = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Machine')
          Write-Output "the password checks out on this machine: $($machine.ValidateCredentials($env:OCCAMY_RDP_WINDOWS_USER, $env:OCCAMY_RDP_WINDOWS_PASSWORD))"
          net user $env:OCCAMY_RDP_WINDOWS_USER
        }
        Write-Output '== logons in the last 30 minutes, and whether they are audited'
        auditpol /get /subcategory:Logon
        Get-WinEvent -ListLog Security | Format-List IsEnabled, LogMode, RecordCount, LastWriteTime
        # The check of the password above is a control: it logs on too.
        Start-Sleep -Seconds 5
        $events = @()
        try {
          $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4624, 4625; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction Stop)
        } catch {
          Write-Output "reading them failed: $_"
        }
        Write-Output "$($events.Count) events of 4624 and 4625, by the user they name:"
        $events | Group-Object { "$($_.Id) $($_.Properties[5].Value)" } | Format-Table Count, Name
        $logons = @($events | Where-Object { "$($_.Properties[5].Value)" -eq $env:OCCAMY_RDP_WINDOWS_USER } | Sort-Object TimeCreated)
        Write-Output "$($logons.Count) of them name the session user, in UTC:"
        foreach ($record in $logons) {
          $when = $record.TimeCreated.ToUniversalTime().ToString('HH:mm:ss.fff')
          $p = $record.Properties
          if ($record.Id -eq 4624) {
            Write-Output "$when 4624 logon type $($p[8].Value), process $($p[9].Value), package $($p[10].Value), NTLM $($p[14].Value), address $($p[18].Value)"
          } else {
            Write-Output ("$when 4625 status {0:x8}, sub status {1:x8}, logon type $($p[10].Value), process $($p[11].Value), package $($p[12].Value), address $($p[19].Value)" -f $p[7].Value, $p[9].Value)
          }
        }

        # What takes in the port now: a first logon may add rules.
        function Test-Covers3389($filter) {
          if ("$($filter.Protocol)" -notin 'Any', 'TCP', 'UDP', '6', '17') { return $false }
          foreach ($port in @($filter.LocalPort)) {
            if ("$port" -eq 'Any') { return $true }
            if ("$port" -match '^\d+$' -and [int]"$port" -eq 3389) { return $true }
            if ("$port" -match '^(\d+)-(\d+)$' -and [int]$Matches[1] -le 3389 -and [int]$Matches[2] -ge 3389) { return $true }
          }
          return $false
        }
        $ports = @{}
        Get-NetFirewallPortFilter -All -PolicyStore ActiveStore | ForEach-Object { $ports[$_.InstanceID] = $_ }
        $covering = @(Get-NetFirewallRule -PolicyStore ActiveStore | Where-Object {
          $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow' -and $_.Enabled -eq 'True' -and $null -ne $ports[$_.InstanceID] -and (Test-Covers3389 $ports[$_.InstanceID])
        })
        Write-Output "== inbound allow rules that take in port 3389 at the end: $($covering.Count)"
        $covering | ForEach-Object { Write-Output "  $($_.DisplayName) [$($_.Profile)] owner '$($_.Owner)'" }
        exit 0
    - name: Look for the password in what the run leaves
      id: scan
      if: always()
      run: |
        $password = $env:OCCAMY_RDP_WINDOWS_PASSWORD
        if (-not $password) {
          Write-Output 'no password was made'
          exit 0
        }
        # As text and as UTF-16, the way Windows and Tee-Object write it.
        $latin1 = [System.Text.Encoding]::GetEncoding(28591)
        $forms = @($password, $latin1.GetString([System.Text.Encoding]::Unicode.GetBytes($password)))
        function Test-Password([byte[]] $bytes) {
          $text = $latin1.GetString($bytes)
          foreach ($form in $forms) {
            if ($text.Contains($form)) { return $true }
          }
          return $false
        }
        # A scan that cannot find it proves nothing.
        if (-not (Test-Password ([System.Text.Encoding]::UTF8.GetBytes("<$password>")))) { throw 'the scan misses text' }
        if (-not (Test-Password ([System.Text.Encoding]::Unicode.GetBytes("<$password>")))) { throw 'the scan misses UTF-16' }

        $files = @()
        $dump = Join-Path $env:RUNNER_TEMP 'rdp-dump'
        if (Test-Path -LiteralPath $dump) { $files += @(Get-ChildItem -LiteralPath $dump -File -Recurse) }
        foreach ($name in 'rdp-test.log', 'rdp-check.log') {
          $log = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path -LiteralPath $log) { $files += @(Get-Item -LiteralPath $log) }
        }
        $hits = 0
        foreach ($file in $files) {
          $stream = [System.IO.File]::OpenRead($file.FullName)
          if ($file.Extension -eq '.gz') {
            $stream = New-Object System.IO.Compression.GZipStream($stream, [System.IO.Compression.CompressionMode]::Decompress)
          }
          $buffer = New-Object System.IO.MemoryStream
          $stream.CopyTo($buffer)
          $stream.Dispose()
          $hit = Test-Password ($buffer.ToArray())
          Write-Output "$($file.Name): $($buffer.Length) bytes, password found $hit"
          if ($hit) { $hits++ }
        }
        if ($hits -gt 0) { throw "the password is in $hits files, so they stay on the runner" }
    - name: Keep the screenshots
      if: always() && steps.scan.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: windows-rdp
        path: ${{ runner.temp }}\rdp-dump
        retention-days: 1
        if-no-files-found: warn
