name: Release

# A v* tag builds and publishes a release: a multi-arch image on GHCR,
# occamyd archives for Linux, macOS and Windows (.goreleaser.yaml), the web
# client archive, SHA256SUMS, provenance attestations, and a GitHub release
# whose notes are the version's CHANGELOG.md section. Manual runs and pull
# requests that touch the release build are dry runs: they build everything
# and publish nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - docker/Dockerfile
      - scripts/third-party-licenses.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  IMAGE: ghcr.io/changkun/occamy
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dryrun' }}

jobs:

  image:
    name: image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Native runners: faster than building under QEMU.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - if: env.PUBLISH == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/${{ matrix.arch }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
    - if: env.PUBLISH == 'true'
      name: Record the digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p digests
        touch "digests/${DIGEST#sha256:}"
    - if: env.PUBLISH == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: digest-${{ matrix.arch }}
        path: digests/*
        if-no-files-found: error

  manifest:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: digest-*
        path: digests
        merge-multiple: true
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - id: manifest
      name: Create the multi-arch manifest
      working-directory: digests
      run: |
        tags=(-t "$IMAGE:$VERSION")
        case "$VERSION" in
          *-*) ;;
          *) tags+=(-t "$IMAGE:latest") ;;
        esac
        sources=()
        for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
        docker buildx imagetools create "${tags[@]}" "${sources[@]}"
        digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ env.IMAGE }}
        subject-digest: ${{ steps.manifest.outputs.digest }}
        push-to-registry: true

  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Build
      working-directory: client/occamy-web
      run: |
        npm ci --no-audit --no-fund
        npm run build
    - name: Archive
      run: |
        mkdir -p release
        # Reproducible: fixed order, owners and timestamps.
        epoch=$(git log -1 --format=%ct)
        tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$epoch" \
          --transform "s,^,occamy-web-$VERSION/," \
          -cf - -C client/occamy-web dist LICENSE.guacamole NOTICE.guacamole \
          -C "$GITHUB_WORKSPACE" LICENSE \
          | gzip -n > "release/occamy-web-$VERSION.tar.gz"
        tar -tzf "release/occamy-web-$VERSION.tar.gz" | head
    - uses: actions/upload-artifact@v7
      with:
        name: release-web
        path: release/*
        if-no-files-found: error

  binaries:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # GoReleaser reads the version and the commit date from git.
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - uses: goreleaser/goreleaser-action@v7
      with:
        version: v2.18.3
        args: release --clean ${{ env.PUBLISH != 'true' && '--snapshot' || '' }}
    - uses: actions/upload-artifact@v7
      with:
        name: release-binaries
        path: |
          dist/*.tar.gz
          dist/*.zip
        if-no-files-found: error

  release:
    needs: [manifest, web, binaries]
    # manifest is skipped in dry runs, which must not skip this job.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: release-*
        path: release
        merge-multiple: true
    - name: Release notes
      run: |
        section="${VERSION#v}"
        if [ "$PUBLISH" != true ]; then section=Unreleased; fi
        awk -v head="## [$section]" '
          /^## \[/ { if (found) exit; if (index($0, head) == 1) { found = 1; next } }
          found { print }
        ' CHANGELOG.md > notes.md
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "::error::CHANGELOG.md has no entries under [$section]"
          exit 1
        fi
        cat notes.md
    - name: Checksums
      working-directory: release
      run: |
        sha256sum -- * > SHA256SUMS
        cat SHA256SUMS
    - if: env.PUBLISH == 'true'
      uses: actions/attest-build-provenance@v4
      with:
        subject-checksums: release/SHA256SUMS
    - if: env.PUBLISH == 'true'
      name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prerelease=
        case "$VERSION" in *-*) prerelease=--prerelease ;; esac
        gh release create "$VERSION" release/* --verify-tag --title "$VERSION" \
          --notes-file notes.md $prerelease
