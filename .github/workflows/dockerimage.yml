name: Builds

on:
  # Pull requests run through pull_request, so pushes only need to cover
  # master; running both would test every PR branch twice.
  push:
    branches: [master]
  pull_request:

jobs:

  go:
    runs-on: ubuntu-latest
    env:
      # libguac dlopen()s protocol plugins by unversioned name.
      LD_LIBRARY_PATH: /usr/local/lib
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Install libguac build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf automake libtool make pkg-config \
          libcairo2-dev libpango1.0-dev libpng-dev \
          libssh2-1-dev libssl-dev libvncserver-dev
    - name: Build libguac
      run: sudo ./guacamole/src/build-libguac.sh "$PWD/guacamole" /usr/local
    - name: Vet
      run: go vet ./...
    # tests/ needs the demo stack and runs in the e2e job.
    - name: Test
      run: go test -race ./internal/... ./server/...
    - name: Vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/occamy-web
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci --no-audit --no-fund
    - run: npm run lint
    - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: make build

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build the image
      run: make build CONTAINER_ENGINE=docker
    - name: Start the demo stack
      run: make run CONTAINER_ENGINE=docker
    - name: End-to-end tests
      run: make e2e
    - name: Demo stack logs
      if: failure()
      working-directory: docker
      run: docker compose logs
