name: Builds

on:
  # Pull requests run through pull_request, so pushes only need to cover
  # master; running both would test every PR branch twice.
  push:
    branches: [master]
  pull_request:

jobs:

  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build
      run: CGO_ENABLED=0 go build ./...
    - name: Vet
      run: go vet ./...
    # tests/ needs the demo stack and runs in the e2e job; here it skips.
    - name: Test
      run: go test -race ./...
    - name: Vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
    # Release archives carry dependency licenses
    # (scripts/third-party-licenses.sh); keep them redistributable.
    - name: Licenses
      run: go run github.com/google/go-licenses/v2@v2.0.1 check . --disallowed_types=forbidden,restricted

  # occamyd needs no C toolchain, so it builds wherever Go does.
  cross:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build
      env:
        CGO_ENABLED: "0"
      run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/occamy-web
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci --no-audit --no-fund
    - run: npm run lint
    - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: make build

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build the image
      run: make build CONTAINER_ENGINE=docker
    - name: Start the demo stack
      run: make run CONTAINER_ENGINE=docker
    - name: End-to-end tests
      run: make e2e
    - name: Demo stack logs
      if: failure()
      working-directory: docker
      run: docker compose logs
