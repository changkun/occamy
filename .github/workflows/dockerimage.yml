name: Builds

on:
  # Pull requests run through pull_request, so pushes only need to cover
  # master; running both would test every PR branch twice.
  push:
    branches: [master]
  pull_request:

jobs:

  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build
      run: CGO_ENABLED=0 go build ./...
    - name: Vet
      run: go vet ./...
    # tests/ needs the demo stack and runs in the e2e job; here it skips.
    - name: Test
      run: go test -race ./...
    - name: Vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
    # Release archives carry dependency licenses
    # (scripts/third-party-licenses.sh); keep them redistributable. Every
    # package, not only occamyd's, so that a dependency is checked before
    # occamyd links it.
    - name: Licenses
      run: go run github.com/google/go-licenses/v2@v2.0.1 check ./... --disallowed_types=forbidden,restricted
    # bench/codecs is a module of its own (docs/benchmarks/codecs.md).
    # Vet with the measure tag builds the measurement, which runs by hand.
    - name: Codec measurement
      working-directory: bench/codecs
      run: |
        go vet -tags measure ./...
        go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    # Linters and formatters are configured in .golangci.yml.
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
    # The RDP integration tests build only under their tag.
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: --build-tags=rdp_integration ./internal/rdp/... ./internal/backend/rdp/...
    # The comparison benchmark's analysis, on synthetic results with known
    # answers. pipx is on the runner; uv brings the script's own packages.
    - name: Benchmark analysis tests
      run: pipx run uv run bench/report_test.py

  # occamyd needs no C toolchain, so it builds wherever Go does.
  cross:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build
      env:
        CGO_ENABLED: "0"
      run: go build ./...

  # The macOS app: the Go client core's C export layer, tested in process
  # against the interop server, and built as a universal archive for
  # macOS 26, the oldest the app runs on.
  macos:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Test the export layer and its decoders
      run: go test -race ./client/occamy-swift/core/ ./client/decoders/
    - name: Build the core archive
      run: make swift-core

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/occamy-web
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    # The protocol client's interop test runs it against occamyd's stream
    # code, served by client/internal/webinterop, built with the race
    # detector, which stops the server at a race and so fails the test.
    # No Go cache: this job would save one holding only the interop
    # server's build, which the go job would then restore.
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        cache: false
    - name: Build the interop server
      working-directory: .
      run: go build -race -o "$RUNNER_TEMP/webinterop" ./client/internal/webinterop
    - run: npm ci --no-audit --no-fund
    - run: npm run lint
    - run: npm run typecheck
    - name: Test
      env:
        OCCAMY_INTEROP_SERVER: ${{ runner.temp }}/webinterop
        GORACE: halt_on_error=1
      run: npm test
    - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: make build

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build the image
      run: make build CONTAINER_ENGINE=docker
    # OCCAMY_DEBUG=1 serves occamy-v1's debug listener, from which the
    # pressure test counts occamyd's goroutines, on the loopback
    # interface.
    - name: Start the demo stack
      run: make run CONTAINER_ENGINE=docker OCCAMY_DEBUG=1
    - name: Resources before the tests
      working-directory: docker
      run: docker stats --no-stream
    # OCCAMY_PRESSURE_N=10 adds the pressure test: 60 concurrent sessions
    # over the three demo servers. A test kills a process in the rdp
    # container and reads its log with the compose command that started
    # the stack, so it takes the same CONTAINER_ENGINE as make run.
    - name: End-to-end and pressure tests
      run: make e2e OCCAMY_PRESSURE_N=10 CONTAINER_ENGINE=docker
    - name: Resources after the tests
      working-directory: docker
      run: docker stats --no-stream
    - name: Demo stack logs
      if: failure()
      working-directory: docker
      run: docker compose logs

  bench:
    # A short run of the benchmark harness, to keep it working. Numbers
    # from shared runners mean nothing, so nothing is compared. It takes
    # 20 to 25 minutes; a stack that stopped answering fails it at 30
    # rather than at GitHub's default of 6 hours. Each run stops at its
    # first error, and the stack's logs follow a failure or a timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    # occamyd asks for BBR, which the runner's kernel has as a module.
    - name: Load BBR
      run: sudo modprobe tcp_bbr
    - name: Benchmark smoke run
      run: make bench CONTAINER_ENGINE=docker BENCH_FLAGS="-quick -failfast -net N0,N1 -engine none"
    # The v1 series on the stack that make bench started: SSH, VNC and
    # RDP, also with a client that offers a frame window of 2, on a
    # server that asks for CUBIC in place of BBR, and RDP without its
    # graphics pipeline. N1 alone, since the run above, of guacd and
    # v1-native, covers the proxy without delay.
    - name: Benchmark smoke run, protocol v1
      run: go run ./bench -quick -failfast -net N1 -engine none -series v1-native,v1-native-w2,v1-native-cubic,v1-native-nogfx -out bench-v1-results.json
    - name: Stack logs
      if: ${{ !success() }}
      working-directory: docker
      run: docker compose -f docker-compose.yaml -f docker-compose.bench.yaml logs
