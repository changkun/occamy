name: Builds

on:
  # Pull requests run through pull_request, so pushes only need to cover
  # master; running both would test every PR branch twice.
  push:
    branches: [master]
  pull_request:

jobs:

  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build
      run: CGO_ENABLED=0 go build ./...
    - name: Vet
      run: go vet ./...
    # tests/ needs the demo stack and runs in the e2e job; here it skips.
    - name: Test
      run: go test -race ./...
    - name: Vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
    # Release archives carry dependency licenses
    # (scripts/third-party-licenses.sh); keep them redistributable.
    - name: Licenses
      run: go run github.com/google/go-licenses/v2@v2.0.1 check . --disallowed_types=forbidden,restricted
    # bench/codecs is a module of its own (docs/benchmarks/codecs.md).
    # Vet with the measure tag builds the measurement, which runs by hand.
    - name: Codec measurement
      working-directory: bench/codecs
      run: |
        go vet -tags measure ./...
        go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    # Linters and formatters are configured in .golangci.yml.
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0

  # occamyd needs no C toolchain, so it builds wherever Go does.
  cross:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build
      env:
        CGO_ENABLED: "0"
      run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/occamy-web
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci --no-audit --no-fund
    - run: npm run lint
    - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: make build

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Build the image
      run: make build CONTAINER_ENGINE=docker
    - name: Start the demo stack
      run: make run CONTAINER_ENGINE=docker
    - name: Resources before the tests
      working-directory: docker
      run: |
        docker stats --no-stream
        docker compose top guacd
    # OCCAMY_PRESSURE_N=10 adds the pressure test: 60 concurrent sessions
    # over the three demo servers.
    - name: End-to-end and pressure tests
      run: make e2e OCCAMY_PRESSURE_N=10
    # guacd forks a process for each connection, which should exit once
    # the connection's last user has left. Under the pressure test, guacd
    # 1.6 has kept a VNC process whose users had all left (specs/003), so
    # a leftover process is a warning, not a failure.
    - name: Resources after the tests
      working-directory: docker
      run: |
        guacd=$(docker compose ps -q guacd)
        for i in $(seq 30); do
          n=$(docker top "$guacd" -eo pid,comm | awk '$2 == "guacd"' | wc -l)
          [ "$n" -eq 1 ] && break
          sleep 1
        done
        docker stats --no-stream
        docker compose top guacd
        if [ "$n" -ne 1 ]; then
          echo "::warning::guacd runs $n processes after the tests, want 1"
          docker compose logs guacd
        fi
    - name: Demo stack logs
      if: failure()
      working-directory: docker
      run: docker compose logs

  bench:
    # A short run of the benchmark harness, to keep it working. Numbers
    # from shared runners mean nothing, so nothing is compared.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
    - name: Benchmark smoke run
      run: make bench CONTAINER_ENGINE=docker BENCH_FLAGS="-quick -net N0,N1 -engine none"
    - name: Stack logs
      if: failure()
      working-directory: docker
      run: docker compose -f docker-compose.yaml -f docker-compose.bench.yaml logs
