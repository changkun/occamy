version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /client/occamy-web
    schedule:
      interval: weekly
    # typescript-eslint 8.72.1 takes typescript below 6.1. Drop this once
    # a release of it takes 7.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      web:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /docker
      - /docker/demo/vnc
      - /docker/demo/ssh
      - /docker/demo/rdp
      - /docker/demo/desktop
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]
