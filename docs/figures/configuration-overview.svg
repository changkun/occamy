<rect x="250" y="374" width="450" height="9" rx="4" fill="none" stroke="#1baf7a" stroke-width="1.2"/>
<circle cx="250" cy="378.5" r="5" fill="#eb6834"/>
<rect x="330" y="390" width="230" height="9" rx="4" fill="#1baf7a" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<rect x="330" y="390" width="230" height="9" rx="4" fill="none" stroke="#1baf7a" stroke-width="1.2"/>
<circle cx="330" cy="394.5" r="5" fill="#eb6834"/>
<rect x="420" y="406" width="280" height="9" rx="4" fill="#1baf7a" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<rect x="420" y="406" width="280" height="9" rx="4" fill="none" stroke="#1baf7a" stroke-width="1.2"/>
<circle cx="420" cy="410.5" r="5" fill="#eb6834"/>
<line x1="620" y1="366" x2="620" y2="430" stroke="#898781" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M 620 424 L 626 430 L 620 436 L 614 430 Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="612" y="364" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="end">You edit occamy.yaml: nothing changes yet</text>
<text x="54" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0b0b0b" text-anchor="start">occamyd starts</text>
<text x="54" y="467" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">It reads occamy.yaml, tls, the signing</text>
<text x="54" y="482" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">key and the trusted issuers' keys.</text>
<text x="440" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0b0b0b" text-anchor="middle">Sessions</text>
<text x="440" y="467" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">Each reads its secret (orange)</text>
<text x="440" y="482" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">as it starts.</text>
<text x="788" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0b0b0b" text-anchor="end">Restart</text>
<text x="788" y="467" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="end">occamyd reads the edited</text>
<text x="788" y="482" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="end">file; every session ends.</text>
</svg>
