<line x1="644" y1="32" x2="644" y2="40" stroke="#898781" stroke-width="1"/>
<text x="406.0" y="24" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">occamyd, as occamy.yaml configures it</text>
<line x1="151.0" y1="194" x2="659.0" y2="194" stroke="#eb6834" stroke-width="1.6"/>
<line x1="151.0" y1="194" x2="151.0" y2="216" stroke="#eb6834" stroke-width="1.6"/>
<line x1="405.0" y1="194" x2="405.0" y2="216" stroke="#eb6834" stroke-width="1.6"/>
<line x1="659.0" y1="194" x2="659.0" y2="216" stroke="#eb6834" stroke-width="1.6"/>
<line x1="572.0" y1="194" x2="572.0" y2="177.0" stroke="#eb6834" stroke-width="1.6"/>
<path d="M 572.0 170.0 L 575.9 177.0 L 568.1 177.0 Z" fill="#eb6834"/>
<text x="159.0" y="187" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#eb6834" text-anchor="start">credentials names exactly one source</text>
<rect x="33.0" y="216" width="236" height="92" rx="8" fill="#eb6834" stroke="none" stroke-width="1" fill-opacity="0.09"/>
<rect x="33.0" y="216" width="236" height="92" rx="8" fill="none" stroke="#eb6834" stroke-width="1.5"/>
<text x="45.0" y="238" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#0b0b0b" text-anchor="start">A file on disk</text>
<text x="45.0" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">password_file</text>
<text x="45.0" y="273" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">private_key_file, token_file</text>
<text x="45.0" y="296" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">read as each session starts</text>
<rect x="287.0" y="216" width="236" height="92" rx="8" fill="#eb6834" stroke="none" stroke-width="1" fill-opacity="0.09"/>
<rect x="287.0" y="216" width="236" height="92" rx="8" fill="none" stroke="#eb6834" stroke-width="1.5"/>
<text x="299.0" y="238" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#0b0b0b" text-anchor="start">An environment variable</text>
<text x="299.0" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">password_env, token_env</text>
<text x="299.0" y="296" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">fixed when occamyd starts</text>
<rect x="541.0" y="216" width="236" height="92" rx="8" fill="#eb6834" stroke="none" stroke-width="1" fill-opacity="0.09"/>
<rect x="541.0" y="216" width="236" height="92" rx="8" fill="none" stroke="#eb6834" stroke-width="1.5"/>
<text x="553.0" y="238" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#0b0b0b" text-anchor="start">The session's owner</text>
<text x="553.0" y="258" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">prompt: true</text>
<text x="553.0" y="296" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">asked as each session starts, never kept</text>
<text x="22" y="348" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#0b0b0b" text-anchor="start">When occamyd reads what</text>
<line x1="30" y1="430" x2="783.0" y2="430.0" stroke="#898781" stroke-width="1.2"/>
<path d="M 790.0 430.0 L 783.0 433.9 L 783.0 426.1 Z" fill="#898781"/>
<text x="790" y="422" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="end">time</text>
<line x1="60" y1="360" x2="60" y2="430" stroke="#0b0b0b" stroke-width="2"/>
<circle cx="60" cy="430" r="4.5" fill="#0b0b0b"/>
