<svg xmlns="http://www.w3.org/2000/svg" width="810" height="500" viewBox="0 0 810 500">
<rect width="810" height="500" fill="#fcfcfb"/>
<rect x="22" y="46" width="124" height="122" rx="8" fill="#898781" stroke="none" stroke-width="1" fill-opacity="0.06"/>
<rect x="22" y="46" width="124" height="122" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="34" y="70" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">A user</text>
<text x="34" y="94" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">web client, or</text>
<text x="34" y="110" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Occamy for macOS</text>
<rect x="168" y="46" width="144" height="122" rx="8" fill="#2a78d6" stroke="none" stroke-width="1" fill-opacity="0.1"/>
<rect x="168" y="46" width="144" height="122" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="180" y="70" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Take the request</text>
<text x="180" y="94" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">listen</text>
<text x="180" y="110" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">tls</text>
<text x="180" y="126" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">origins</text>
<text x="180" y="142" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">web_client</text>
<rect x="334" y="46" width="144" height="122" rx="8" fill="#6250d6" stroke="none" stroke-width="1" fill-opacity="0.1"/>
<rect x="334" y="46" width="144" height="122" rx="8" fill="none" stroke="#6250d6" stroke-width="1.5"/>
<text x="346" y="70" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Sign the user in</text>
<text x="346" y="94" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">auth:</text>
<text x="360" y="110" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">users</text>
<text x="360" y="126" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">oidc</text>
<text x="360" y="142" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">trusted_issuers</text>
<text x="360" y="158" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">signing_key_file</text>
<rect x="500" y="46" width="144" height="122" rx="8" fill="#1baf7a" stroke="none" stroke-width="1" fill-opacity="0.1"/>
<rect x="500" y="46" width="144" height="122" rx="8" fill="none" stroke="#1baf7a" stroke-width="1.5"/>
<text x="512" y="70" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Open a connection</text>
<text x="512" y="94" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">connections:</text>
<text x="526" y="110" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">- target</text>
<text x="540" y="126" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">allow</text>
<text x="540" y="142" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">credentials</text>
<rect x="666" y="46" width="124" height="122" rx="8" fill="#898781" stroke="none" stroke-width="1" fill-opacity="0.06"/>
<rect x="666" y="46" width="124" height="122" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="678" y="70" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">The remote</text>
<text x="678" y="94" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">SSH, VNC or RDP</text>
<text x="678" y="110" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">server, or a</text>
<text x="678" y="126" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Kubernetes pod</text>
<text x="678" y="144" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">checked with</text>
<text x="678" y="159" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">host_keys, tls</text>
