<text x="506" y="40" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">copy-rect</text>
<text x="506" y="58" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">The window scrolled up a line, so</text>
<text x="506" y="74" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">the client moves pixels it has.</text>
<circle cx="489" cy="102" r="9" fill="#2a78d6"/>
<text x="489" y="106" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="506" y="106" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">tile, deflate</text>
<text x="506" y="124" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">The new line of text, exact:</text>
<text x="506" y="140" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">one message a tile.</text>
<circle cx="489" cy="168" r="9" fill="#eb6834"/>
<text x="489" y="172" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="506" y="172" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">tile, webp</text>
<text x="506" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">A video in motion, lossy: two</text>
<text x="506" y="206" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">messages of 3 tiles side by side.</text>
<circle cx="489" cy="234" r="9" fill="#1baf7a"/>
<text x="489" y="238" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="506" y="238" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">tile, cached</text>
<text x="506" y="256" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">An icon the client holds in</text>
<text x="506" y="272" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">slot 5. No pixels are sent.</text>
<text x="24" y="306" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Each square is a tile of 64 pixels. Tiles without colour did not change and are not sent.</text>
<text x="24" y="336" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="start">The frame's messages, in the order they are sent</text>
