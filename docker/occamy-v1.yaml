# The v1 file of the demo stack's occamy-v1 service
# (docker-compose.yaml), which serves API v1, protocol v1 and the web
# client on port 5637: a real desktop first, over VNC and RDP, then the
# demo SSH server, the demo VNC servers, x11vnc and TigerVNC, with each
# security type and keyboard layout that tests/parity_test.go checks,
# and the demo RDP server. The user
# demo signs in with the password occamy, in the web client at
# http://localhost:5637/static/ or with curl. That user is this demo's
# alone: occamyd has no default user, and a real install lists its own
# users or sets auth.oidc (docs/configuration.md).
#
#	curl -s localhost:5637/api/v1/auth/token \
#	  -H 'Content-Type: application/json' \
#	  -d '{"username":"demo","password":"occamy"}'

version: 1
listen: 0.0.0.0:5637
# The image's build of the web client, served under /static/.
web_client: client/occamy-web/dist
# The debug listener, for the soak (tests/soak_test.go), which samples
# occamyd's goroutines, heap and open files from it, and the pressure
# test (tests/pressure_test.go), which counts its goroutines: off
# unless make run OCCAMY_DEBUG=1 sets OCCAMY_V1_DEBUG_ADDRESS, which
# docker-compose.yaml passes on, and then published on the host's
# loopback interface only. occamyd warns at start that it is not on a
# loopback address, which inside the container it cannot be and still
# be published.
debug:
  address_env: OCCAMY_V1_DEBUG_ADDRESS
# The pressure test opens 60 sessions at once as demo, past the default
# of 10 a user.
limits:
  sessions_per_user: 100
auth:
  # Where a real install keeps it, on a volume (docker-compose.yaml):
  # occamyd creates the key at start, and tokens survive a restart.
  signing_key_file: /var/lib/occamy/signing.key
  users:
    - name: demo
      password_hash: "$2a$10$DXEVjCzdy7mEP0VBuqhlqunMrnP3lSGh0/kl6yLwA5Rhrl4hLhjPu"
connections:
  # A real desktop, first, for a first look: XFCE with Firefox, a session
  # of its own for each protocol.
  - id: desktop-vnc
    name: Desktop (XFCE) over VNC
    protocol: vnc
    target: desktop:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: desktop-rdp
    name: Desktop (XFCE) over RDP
    protocol: rdp
    target: desktop:3389
    # As for rdp: xrdp signs its certificate itself.
    security: tls
    tls: {insecure_skip_verify: true}
    credentials: {username: occamy, password_env: OCCAMY_DEMO_RDP_PASSWORD}
    allow: {users: [demo]}
  - id: ssh
    name: SSH
    protocol: ssh
    target: ssh:22
    # The demo server makes its host keys when it starts.
    insecure_ignore_host_key: true
    credentials: {username: occamy, password_env: OCCAMY_DEMO_SSH_PASSWORD}
    allow: {users: [demo]}
  # Each VNC server and security type, which tests/parity_test.go
  # checks, and the RDP server. The connections that prompt ask the
  # owner for whatever the server wants, and for nothing where it wants
  # nothing (None). The de and fr connections reach screens with the
  # German and French keyboard layouts, for the matrix's keyboard rows.
  - id: vnc
    name: x11vnc
    protocol: vnc
    target: vnc:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: vnc-none
    name: x11vnc without a password
    protocol: vnc
    target: vnc:5901
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: tigervnc
    name: TigerVNC
    protocol: vnc
    target: tigervnc:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-prompt
    name: TigerVNC, asking for the password
    protocol: vnc
    target: tigervnc:5900
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: tigervnc-plain
    name: TigerVNC over VeNCrypt
    protocol: vnc
    target: tigervnc:5901
    # VeNCrypt's Plain, as the user occamy, over TLS with a certificate
    # from the CA that the tigervnc service makes.
    credentials: {username: occamy, password_env: OCCAMY_DEMO_PLAIN_PASSWORD}
    tls: {ca_file: /run/occamy-vnc-ca/ca.pem}
    allow: {users: [demo]}
  - id: tigervnc-none
    name: TigerVNC without a password
    protocol: vnc
    target: tigervnc:5902
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: vnc-de
    name: x11vnc with the German layout
    protocol: vnc
    target: vnc:5902
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: vnc-fr
    name: x11vnc with the French layout
    protocol: vnc
    target: vnc:5903
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-de
    name: TigerVNC with the German layout
    protocol: vnc
    target: tigervnc:5903
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-fr
    name: TigerVNC with the French layout
    protocol: vnc
    target: tigervnc:5904
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: rdp
    name: RDP
    protocol: rdp
    target: rdp:3389
    # xrdp speaks TLS without NLA, and signs its certificate itself when
    # the image is built, so there is nothing to pin in advance: for the
    # demo only, and occamyd warns of it when it starts.
    security: tls
    tls: {insecure_skip_verify: true}
    credentials: {username: occamy, password_env: OCCAMY_DEMO_RDP_PASSWORD}
    allow: {users: [demo]}
