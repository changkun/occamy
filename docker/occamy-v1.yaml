# The v1 file of the demo stack's occamy-v1 service
# (docker-compose.yaml), which serves API v1 and protocol v1 on port 5637
# next to the v0 service: the demo VNC and RDP servers through occamyd's
# native backends and through guacd, side by side, guacd as the fallback
# and the baseline the native backends are measured against
# (specs/008-native-architecture/guacd-bridge.md). The user demo signs in
# with the password occamy:
#
#	curl -s localhost:5637/api/v1/auth/token \
#	  -H 'Content-Type: application/json' \
#	  -d '{"username":"demo","password":"occamy"}'

version: 1
listen: 0.0.0.0:5637
auth:
  # On a tmpfs (docker-compose.yaml): occamyd creates the key at start,
  # and tokens die with the container.
  signing_key_file: /run/occamy/signing.key
  users:
    - name: demo
      password_hash: "$2a$10$DXEVjCzdy7mEP0VBuqhlqunMrnP3lSGh0/kl6yLwA5Rhrl4hLhjPu"
connections:
  - id: vnc-native
    name: VNC, native backend
    protocol: vnc
    backend: native
    target: vnc:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: vnc-guacd
    name: VNC, through guacd
    protocol: vnc
    # backend: guacd is vnc's default.
    target: vnc:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: rdp-native
    name: RDP, native backend
    protocol: rdp
    # backend: native is rdp's default.
    target: rdp:3389
    # xrdp speaks TLS without NLA, and signs its certificate itself when
    # the image is built, so there is nothing to pin in advance: for the
    # demo only.
    security: tls
    tls: {insecure_skip_verify: true}
    credentials: {username: occamy, password_env: OCCAMY_DEMO_RDP_PASSWORD}
    allow: {users: [demo]}
  - id: rdp-guacd
    name: RDP, through guacd
    protocol: rdp
    backend: guacd
    target: rdp:3389
    credentials: {username: occamy, password_env: OCCAMY_DEMO_RDP_PASSWORD}
    allow: {users: [demo]}
guacd:
  address: guacd:4822
  params:
    # For rdp-guacd: accept xrdp's self-signed certificate.
    rdp: {ignore-cert: "true"}
