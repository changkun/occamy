# The v1 file of the demo stack's occamy-v1 service
# (docker-compose.yaml), which serves API v1 and protocol v1 on port 5637
# next to the v0 service: the demo VNC servers, x11vnc and TigerVNC,
# through occamyd's native backend, vnc's default, and through guacd, the
# explicit fallback and the benchmark's baseline, side by side, for the
# guacd bridge's parity gate
# (specs/008-native-architecture/guacd-bridge.md, Parity gate). The user
# demo signs in with the password occamy:
#
#	curl -s localhost:5637/api/v1/auth/token \
#	  -H 'Content-Type: application/json' \
#	  -d '{"username":"demo","password":"occamy"}'

version: 1
listen: 0.0.0.0:5637
# The debug listener, for the soak (tests/soak_test.go), which samples
# occamyd's goroutines, heap and open files from it. docker-compose.yaml
# publishes it on the host's loopback interface only; occamyd warns at
# start that it is not on a loopback address, which inside the container
# it cannot be and still be published.
debug:
  address: 0.0.0.0:5638
auth:
  # On a tmpfs (docker-compose.yaml): occamyd creates the key at start,
  # and tokens die with the container.
  signing_key_file: /run/occamy/signing.key
  users:
    - name: demo
      password_hash: "$2a$10$DXEVjCzdy7mEP0VBuqhlqunMrnP3lSGh0/kl6yLwA5Rhrl4hLhjPu"
connections:
  # Each server and security type twice, through occamyd's native backend
  # and through guacd, which tests/parity_test.go compares. Each names its
  # backend but vnc-native, which serves vnc's default. The
  # connections that prompt ask the owner for whatever the server wants,
  # and for nothing where it wants nothing (None). The de and fr
  # connections reach screens with the German and French keyboard
  # layouts, for the matrix's keyboard rows.
  - id: vnc-native
    name: x11vnc, native backend
    protocol: vnc
    # No backend: native is vnc's default, so this connection serves
    # the default end to end.
    target: vnc:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: vnc-guacd
    name: x11vnc, through guacd
    protocol: vnc
    # guacd serves vnc only when a connection asks for it.
    backend: guacd
    target: vnc:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: vnc-none-native
    name: x11vnc without a password, native backend
    protocol: vnc
    backend: native
    target: vnc:5901
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: vnc-none-guacd
    name: x11vnc without a password, through guacd
    protocol: vnc
    backend: guacd
    target: vnc:5901
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: tigervnc-native
    name: TigerVNC, native backend
    protocol: vnc
    backend: native
    target: tigervnc:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-guacd
    name: TigerVNC, through guacd
    protocol: vnc
    backend: guacd
    target: tigervnc:5900
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-prompt-native
    name: TigerVNC, asking for the password, native backend
    protocol: vnc
    backend: native
    target: tigervnc:5900
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: tigervnc-prompt-guacd
    name: TigerVNC, asking for the password, through guacd
    protocol: vnc
    backend: guacd
    target: tigervnc:5900
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: tigervnc-plain-native
    name: TigerVNC over VeNCrypt, native backend
    protocol: vnc
    backend: native
    target: tigervnc:5901
    # VeNCrypt's Plain, as the user occamy, over TLS with a certificate
    # from the CA that the tigervnc service makes.
    credentials: {username: occamy, password_env: OCCAMY_DEMO_PLAIN_PASSWORD}
    tls: {ca_file: /run/occamy-vnc-ca/ca.pem}
    allow: {users: [demo]}
  - id: tigervnc-plain-guacd
    name: TigerVNC over VeNCrypt, through guacd
    protocol: vnc
    backend: guacd
    target: tigervnc:5901
    # guacd checks no certificate, so no tls.
    credentials: {username: occamy, password_env: OCCAMY_DEMO_PLAIN_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-none-native
    name: TigerVNC without a password, native backend
    protocol: vnc
    backend: native
    target: tigervnc:5902
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: tigervnc-none-guacd
    name: TigerVNC without a password, through guacd
    protocol: vnc
    backend: guacd
    target: tigervnc:5902
    credentials: {prompt: true}
    allow: {users: [demo]}
  - id: vnc-de-native
    name: x11vnc with the German layout, native backend
    protocol: vnc
    backend: native
    target: vnc:5902
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: vnc-de-guacd
    name: x11vnc with the German layout, through guacd
    protocol: vnc
    backend: guacd
    target: vnc:5902
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: vnc-fr-native
    name: x11vnc with the French layout, native backend
    protocol: vnc
    backend: native
    target: vnc:5903
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: vnc-fr-guacd
    name: x11vnc with the French layout, through guacd
    protocol: vnc
    backend: guacd
    target: vnc:5903
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-de-native
    name: TigerVNC with the German layout, native backend
    protocol: vnc
    backend: native
    target: tigervnc:5903
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-de-guacd
    name: TigerVNC with the German layout, through guacd
    protocol: vnc
    backend: guacd
    target: tigervnc:5903
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-fr-native
    name: TigerVNC with the French layout, native backend
    protocol: vnc
    backend: native
    target: tigervnc:5904
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
  - id: tigervnc-fr-guacd
    name: TigerVNC with the French layout, through guacd
    protocol: vnc
    backend: guacd
    target: tigervnc:5904
    credentials: {password_env: OCCAMY_DEMO_VNC_PASSWORD}
    allow: {users: [demo]}
guacd:
  address: guacd:4822
