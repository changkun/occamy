# Demo stack: occamy plus demo servers built from docker/demo/. Services
# reach each other by name on the default network; only occamy is
# published. occamy starts once the servers accept connections, because a
# connection to a server that is not up yet would fail. occamy is not
# restarted automatically, so that a crash fails the end-to-end tests
# instead of going unnoticed.

services:
  occamy:
    image: occamy:latest
    ports:
      - "5636:5636"
    volumes:
      - ./occamy.yaml:/occamy/conf.yaml:ro
    depends_on:
      guacd:
        condition: service_healthy
      vnc:
        condition: service_healthy
      ssh:
        condition: service_healthy
      rdp:
        condition: service_healthy

  guacd:
    # Not used by occamy yet (specs/005-upstream-guacamole/guacd-sessions.md).
    # guacd opens the connections to the demo servers, so the hosts in
    # tokens must resolve from here.
    image: docker.io/guacamole/guacd:1.6.0
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4822"]
      interval: 1s
      retries: 30

  vnc:
    # host vnc:5900, password vncpassword
    build: ./demo/vnc
    environment:
      VNC_PASSWORD: vncpassword
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5900"]
      interval: 1s
      retries: 30

  ssh:
    # host ssh:22, user occamy, password occamy
    build: ./demo/ssh
    environment:
      SSH_PASSWORD: occamy
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/22"]
      interval: 1s
      retries: 30

  rdp:
    # host rdp:3389, user occamy, password occamy
    build: ./demo/rdp
    environment:
      RDP_PASSWORD: occamy
    healthcheck:
      # Look for the listening socket (port 3389 is 0D3D) rather than
      # connect, since xrdp logs errors for every connection that does not
      # speak RDP.
      test: ["CMD", "sh", "-c", "grep -q ':0D3D [0-9A-F]*:0000 0A' /proc/net/tcp /proc/net/tcp6"]
      interval: 1s
      retries: 30
