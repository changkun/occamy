# Demo stack: occamy plus demo servers built from docker/demo/. Services
# reach each other by name on the default network; only occamy and
# occamy-v1 are published. occamy starts once the servers accept
# connections, because a connection to a server that is not up yet would
# fail. occamy is not restarted automatically, so that a crash fails the
# end-to-end tests instead of going unnoticed.
#
# OCCAMY_IMAGE, OCCAMY_PORT and OCCAMY_V1_PORT run a second stack next to
# the first, under another project name (-p), on a shared host.
#
# The debug routes have no authentication, and stay off unless make run
# OCCAMY_DEBUG=1 sets OCCAMY_V0_CONF to occamy-debug.yaml, which serves
# /debug/pprof on occamy's own port, and OCCAMY_V1_DEBUG_ADDRESS, which
# opens occamy-v1's debug listener. Both ports are published on the
# host's loopback interface only; the stack's other services can reach
# them while they are on.

services:
  occamy:
    image: ${OCCAMY_IMAGE:-occamy:latest}
    ports:
      - "127.0.0.1:${OCCAMY_PORT:-5636}:5636"
    volumes:
      - ./${OCCAMY_V0_CONF:-occamy.yaml}:/occamy/conf.yaml:ro
    depends_on:
      guacd:
        condition: service_healthy
      vnc:
        condition: service_healthy
      ssh:
        condition: service_healthy
      rdp:
        condition: service_healthy

  occamy-v1:
    # The same image serving a v1 file (occamy-v1.yaml) on port 5637: the
    # web client, the demo SSH server, and the demo VNC servers, x11vnc
    # and TigerVNC, and the RDP server, through the native backends,
    # their default, and through guacd (backend: guacd), for API v1 and
    # protocol v1 clients.
    image: ${OCCAMY_IMAGE:-occamy:latest}
    command: ["/occamy/occamyd", "-conf", "/occamy/v1.yaml"]
    ports:
      - "${OCCAMY_V1_PORT:-5637}:5637"
      # The debug listener (occamy-v1.yaml), for make soak, on the
      # loopback interface only: it has no authentication. Nothing
      # listens there unless OCCAMY_V1_DEBUG_ADDRESS is set.
      - "127.0.0.1:${OCCAMY_V1_DEBUG_PORT:-5638}:5638"
    volumes:
      - ./occamy-v1.yaml:/occamy/v1.yaml:ro
      # The CA of TigerVNC's VeNCrypt certificate, for the tls of the
      # connection that checks it.
      - tigervnc-ca:/run/occamy-vnc-ca:ro
    tmpfs:
      # The signing key, which the nonroot user creates at start.
      - /run/occamy:mode=1777
    environment:
      OCCAMY_DEMO_SSH_PASSWORD: occamy
      OCCAMY_DEMO_VNC_PASSWORD: vncpassword
      OCCAMY_DEMO_PLAIN_PASSWORD: plainpassword
      OCCAMY_DEMO_RDP_PASSWORD: occamy
      OCCAMY_V1_DEBUG_ADDRESS: ${OCCAMY_V1_DEBUG_ADDRESS:-}
    depends_on:
      guacd:
        condition: service_healthy
      vnc:
        condition: service_healthy
      tigervnc:
        condition: service_healthy
      rdp:
        condition: service_healthy
      ssh:
        condition: service_healthy

  guacd:
    # occamy reaches it as guacd:4822 (occamy.yaml, occamy-v1.yaml). guacd opens the
    # connections to the demo servers, so the hosts in tokens must resolve
    # from here.
    image: docker.io/guacamole/guacd:1.6.0
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4822"]
      interval: 1s
      retries: 30

  vnc:
    # x11vnc: host vnc:5900, password vncpassword; vnc:5901, the same
    # screen without a password; vnc:5902 and vnc:5903, password
    # vncpassword, with the de and fr keyboard layouts.
    build: ./demo/vnc
    environment:
      VNC_PASSWORD: vncpassword
    healthcheck:
      # Look for the listening sockets (5900 to 5903 are 170C to 170F)
      # rather than connect, since x11vnc logs every connection that does
      # not speak RFB.
      test: ["CMD", "sh", "-c", "for p in 170C 170D 170E 170F; do grep -q \":$$p [0-9A-F]*:0000 0A\" /proc/net/tcp /proc/net/tcp6 || exit 1; done"]
      interval: 1s
      retries: 30

  tigervnc:
    # TigerVNC's Xvnc, five screens: host tigervnc:5900, password
    # vncpassword; tigervnc:5901, VeNCrypt only, user occamy, password
    # plainpassword, with a certificate for the name tigervnc from a CA
    # that it writes to the volume tigervnc-ca; tigervnc:5902 without a
    # password; tigervnc:5903 and tigervnc:5904, password vncpassword,
    # with the de and fr keyboard layouts.
    build:
      context: ..
      dockerfile: docker/demo/tigervnc/Dockerfile
    environment:
      VNC_PASSWORD: vncpassword
      PLAIN_PASSWORD: plainpassword
      CA_DIR: /run/occamy-vnc-ca
    volumes:
      - tigervnc-ca:/run/occamy-vnc-ca
    healthcheck:
      # Look for the listening sockets (5900 to 5904 are 170C to 1710)
      # rather than connect, since Xvnc logs every connection that does
      # not speak RFB; and for the CA, which occamy-v1 reads at start.
      test: ["CMD", "sh", "-c", "test -s /run/occamy-vnc-ca/ca.pem && for p in 170C 170D 170E 170F 1710; do grep -q \":$$p [0-9A-F]*:0000 0A\" /proc/net/tcp /proc/net/tcp6 || exit 1; done"]
      interval: 1s
      retries: 30

  ssh:
    # host ssh:22, user occamy, password occamy
    build: ./demo/ssh
    environment:
      SSH_PASSWORD: occamy
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/22"]
      interval: 1s
      retries: 30

  rdp:
    # host rdp:3389, user occamy, password occamy
    build: ./demo/rdp
    environment:
      RDP_PASSWORD: occamy
    healthcheck:
      # Look for the listening socket (port 3389 is 0D3D) rather than
      # connect, since xrdp logs errors for every connection that does not
      # speak RDP.
      test: ["CMD", "sh", "-c", "grep -q ':0D3D [0-9A-F]*:0000 0A' /proc/net/tcp /proc/net/tcp6"]
      interval: 1s
      retries: 30

volumes:
  # TigerVNC's CA certificate (tigervnc's CA_DIR), which it writes at
  # start and occamy-v1 reads.
  tigervnc-ca:
