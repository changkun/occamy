# occamy.yaml in debug mode, which serves /debug/pprof on occamy's own
# port without a token, for the pressure test (tests/pressure_test.go).
# make run OCCAMY_DEBUG=1 mounts it in occamy.yaml's place, and
# docker-compose.yaml publishes occamy on the host's loopback interface
# only. Everything but the mode is occamy.yaml's (TestDemoV0Files).

---
address: 0.0.0.0:5636
mode: debug # options: debug/release/test
auth:
  jwt_secret: occamy
  jwt_alg: HS256
client: true # enable web client demo
guacd:
  address: guacd:4822
  params: # per-protocol defaults, merged under token values (see README)
    rdp:
      ignore-cert: "true" # accept self-signed certificates (xrdp, Windows)
      # domain: EXAMPLE   # Windows domain accounts
      # security: nla     # unset negotiates, NLA included
