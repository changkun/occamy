# Benchmark stack: the demo stack plus what specs/008-native-architecture/
# benchmark.md needs. guacd, which occamyd no longer uses, runs here only,
# published on the loopback interface, for the harness's guacd series:
# Guacamole's protocol straight from guacd, the baseline that Occamy is
# measured against. The VNC and RDP servers show the scene program
# (bench/scene) instead of an xterm. They keep their service names, hosts
# and credentials, and are tagged apart from the demo images. occamy-v1
# serves the shell and the bench desktop (bench/occamy-v1.yaml), for the
# v1 series.
#
#   make bench
#
# GUACD_PORT publishes guacd on another port, for a second stack on a
# shared host, as OCCAMY_V1_PORT does for occamyd, and
# OCCAMY_V1_CUBIC_PORT and OCCAMY_V1_CUBIC_DEBUG_PORT publish
# occamy-v1-cubic and its debug listener, as OCCAMY_V1_DEBUG_PORT does
# occamy-v1's.

services:
  guacd:
    # The harness dials it straight, and guacd opens the
    # connections to the bench servers, so their hosts resolve from here.
    image: docker.io/guacamole/guacd:1.6.0
    ports:
      - "127.0.0.1:${GUACD_PORT:-4822}:4822"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4822"]
      interval: 1s
      retries: 30

  desktop:
    # Left out: nothing here connects to it, and no idle desktop should
    # run during measurements. A profile that no command names keeps it
    # from being built or started.
    profiles: [demo-only]

  occamy-v1:
    volumes:
      # Replaces the demo's v1 file, which is mounted at the same path.
      - ./bench/occamy-v1.yaml:/occamy/v1.yaml:ro
    environment:
      OCCAMY_BENCH_SSH_PASSWORD: occamy
      OCCAMY_BENCH_RDP_PASSWORD: occamy
    depends_on:
      ssh:
        condition: service_healthy
      rdp:
        condition: service_healthy

  occamy-v1-cubic:
    # occamy-v1's native connections with CUBIC as occamyd's TCP
    # congestion control, in place of its default, BBR, for
    # v1-native-cubic (bench/occamy-v1-cubic.yaml,
    # specs/008-native-architecture/realtime-transport.md, step 3a). On
    # the loopback interface only: the demo user's password is public.
    image: ${OCCAMY_IMAGE:-occamy:latest}
    command: ["/occamy/occamyd", "-conf", "/occamy/v1.yaml"]
    ports:
      - "127.0.0.1:${OCCAMY_V1_CUBIC_PORT:-5642}:5637"
      # The debug listener, as occamy-v1's (docker-compose.yaml): nothing
      # listens there unless OCCAMY_V1_DEBUG_ADDRESS is set, as
      # make bench-compare does for occamyd's runtime.
      - "127.0.0.1:${OCCAMY_V1_CUBIC_DEBUG_PORT:-5643}:5638"
    volumes:
      - ./bench/occamy-v1-cubic.yaml:/occamy/v1.yaml:ro
    tmpfs:
      # The signing key, which the nonroot user creates at start.
      - /run/occamy:mode=1777
    environment:
      OCCAMY_BENCH_SSH_PASSWORD: occamy
      OCCAMY_BENCH_RDP_PASSWORD: occamy
      OCCAMY_DEMO_VNC_PASSWORD: vncpassword
      OCCAMY_V1_DEBUG_ADDRESS: ${OCCAMY_V1_DEBUG_ADDRESS:-}
    depends_on:
      ssh:
        condition: service_healthy
      vnc:
        condition: service_healthy
      rdp:
        condition: service_healthy

  vnc:
    image: occamy-bench-desktop
    build:
      context: ..
      dockerfile: docker/bench/desktop/Dockerfile
    command: ["vnc"]
    healthcheck:
      # Look for the listening socket (port 5900 is 170C) rather than
      # connect, since x11vnc sets up a client for every connection, and
      # the check runs during measurements.
      test: ["CMD", "sh", "-c", "grep -q ':170C [0-9A-F]*:0000 0A' /proc/net/tcp /proc/net/tcp6"]

  rdp:
    image: occamy-bench-desktop
    build:
      context: ..
      dockerfile: docker/bench/desktop/Dockerfile
    command: ["rdp"]
