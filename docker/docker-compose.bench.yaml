# Benchmark stack: the demo stack plus what specs/008-native-architecture/
# benchmark.md needs. guacd is published on the loopback interface, so that
# the harness can also measure guacd without occamy in between. The VNC
# and RDP servers show the scene program (bench/scene) instead of an
# xterm. They keep their service names, hosts and credentials, and are
# tagged apart from the demo images. occamy-v1 serves the shell and the
# bench desktop through every backend API v1 has for them
# (bench/occamy-v1.yaml), for the v1 series.
#
#   make bench
#
# GUACD_PORT and OCCAMY_V1_GFX_PORT publish guacd and occamy-v1-gfx on
# other ports, for a second stack on a shared host, as OCCAMY_PORT and
# OCCAMY_V1_PORT do for occamyd, and OCCAMY_V1_GFX_DEBUG_PORT the debug
# listener of occamy-v1-gfx, as OCCAMY_V1_DEBUG_PORT does occamy-v1's.
# OCCAMY_V1_BBR_PORT and OCCAMY_V1_BBR_DEBUG_PORT do the same for
# occamy-v1-bbr, which starts only with the bbr profile.

services:
  guacd:
    ports:
      - "127.0.0.1:${GUACD_PORT:-4822}:4822"

  desktop:
    # Left out: nothing here connects to it, and no idle desktop should
    # run during measurements. A profile that no command names keeps it
    # from being built or started.
    profiles: [demo-only]

  occamy-v1:
    volumes:
      # Replaces the demo's v1 file, which is mounted at the same path.
      - ./bench/occamy-v1.yaml:/occamy/v1.yaml:ro
    environment:
      OCCAMY_BENCH_SSH_PASSWORD: occamy
      OCCAMY_BENCH_RDP_PASSWORD: occamy
    depends_on:
      ssh:
        condition: service_healthy
      rdp:
        condition: service_healthy

  occamy-v1-gfx:
    # occamy-v1 with guacd's RDP graphics pipeline on, for v1-guacd-gfx
    # (bench/occamy-v1-gfx.yaml). A service of its own, since guacd's
    # parameters are global to a v1 file. On the loopback interface only:
    # the demo user's password is public.
    image: ${OCCAMY_IMAGE:-occamy:latest}
    command: ["/occamy/occamyd", "-conf", "/occamy/v1.yaml"]
    ports:
      - "127.0.0.1:${OCCAMY_V1_GFX_PORT:-5640}:5637"
      # The debug listener, as occamy-v1's (docker-compose.yaml): nothing
      # listens there unless OCCAMY_V1_DEBUG_ADDRESS is set, as
      # make bench-compare does for occamyd's runtime.
      - "127.0.0.1:${OCCAMY_V1_GFX_DEBUG_PORT:-5641}:5638"
    volumes:
      - ./bench/occamy-v1-gfx.yaml:/occamy/v1.yaml:ro
    tmpfs:
      # The signing key, which the nonroot user creates at start.
      - /run/occamy:mode=1777
    environment:
      OCCAMY_BENCH_RDP_PASSWORD: occamy
      OCCAMY_V1_DEBUG_ADDRESS: ${OCCAMY_V1_DEBUG_ADDRESS:-}
    depends_on:
      guacd:
        condition: service_healthy
      rdp:
        condition: service_healthy

  occamy-v1-bbr:
    # occamy-v1 with BBR as the TCP congestion control of its network
    # namespace, in place of the kernel's default, for v1-native-bbr
    # (specs/008-native-architecture/realtime-transport.md, step 3a). The
    # host's kernel must have BBR loaded, so it starts only with the bbr
    # profile, which make bench-realtime-3a sets. On the loopback
    # interface only, as occamy-v1-gfx.
    profiles: [bbr]
    image: ${OCCAMY_IMAGE:-occamy:latest}
    command: ["/occamy/occamyd", "-conf", "/occamy/v1.yaml"]
    sysctls:
      net.ipv4.tcp_congestion_control: bbr
    ports:
      - "127.0.0.1:${OCCAMY_V1_BBR_PORT:-5642}:5637"
      - "127.0.0.1:${OCCAMY_V1_BBR_DEBUG_PORT:-5643}:5638"
    volumes:
      - ./bench/occamy-v1.yaml:/occamy/v1.yaml:ro
    tmpfs:
      # The signing key that occamy-v1.yaml names, which occamy-v1 keeps on
      # its volume, on a tmpfs: nothing outlives a run here.
      - /var/lib/occamy:mode=1777
    environment:
      OCCAMY_BENCH_SSH_PASSWORD: occamy
      OCCAMY_BENCH_RDP_PASSWORD: occamy
      OCCAMY_DEMO_VNC_PASSWORD: vncpassword
      OCCAMY_V1_DEBUG_ADDRESS: ${OCCAMY_V1_DEBUG_ADDRESS:-}
    depends_on:
      guacd:
        condition: service_healthy
      ssh:
        condition: service_healthy
      vnc:
        condition: service_healthy
      rdp:
        condition: service_healthy

  vnc:
    image: occamy-bench-desktop
    build:
      context: ..
      dockerfile: docker/bench/desktop/Dockerfile
    command: ["vnc"]
    healthcheck:
      # Look for the listening socket (port 5900 is 170C) rather than
      # connect, since x11vnc sets up a client for every connection, and
      # the check runs during measurements.
      test: ["CMD", "sh", "-c", "grep -q ':170C [0-9A-F]*:0000 0A' /proc/net/tcp /proc/net/tcp6"]

  rdp:
    image: occamy-bench-desktop
    build:
      context: ..
      dockerfile: docker/bench/desktop/Dockerfile
    command: ["rdp"]
